services:
  db:
    image: mariadb:11
    container_name: neoauth-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    container_name: neoauth-api
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      HASH_PEPPER: ${HASH_PEPPER}
      METRICS_TOKEN: ${METRICS_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - image_bucket:/app/images
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/')"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build: ./app
    container_name: neoauth-web
    restart: unless-stopped
    # Bound to localhost only: for local use and debugging on the host.
    # Public traffic reaches nginx through the Cloudflare tunnel instead.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - internal

  # Public ingress: outbound-only Cloudflare Tunnel, no open inbound ports.
  # Started with: docker compose --profile tunnel up -d
  cloudflared:
    # Pinned so a deploy moves cloudflared deliberately; bump alongside the
    # other base images when rebuilding.
    image: cloudflare/cloudflared:2026.10.3
    container_name: neoauth-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - web
    networks:
      - internal
    profiles:
      - tunnel

volumes:
  db:
  image_bucket:

networks:
  internal:
