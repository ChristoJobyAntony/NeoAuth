[project]
name = "neoauth-api"
version = "1.0.0"
description = "API for NeoAuth using FastAPI"
authors = [{ name = "Christo", email = "christotantony2003@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=44",
    "pyjwt>=2.15",
    "python-multipart>=0.0.20",
    "cairosvg>=2.7",
    # Transitive via cairosvg; pinned for the Oct 2026 image-decoder CVE fixes.
    "pillow>=13",
    "argon2-cffi>=23.1",
]
